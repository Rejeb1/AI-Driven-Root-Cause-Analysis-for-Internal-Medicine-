[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dxagent"
version = "0.1.0"
description = "Agentic diagnostic reasoning with grounded evidence and abstention"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
llm = ["anthropic>=0.40"]
# The NER layer of the PHI screen (synthesis.phi_scan_ner). Also needs the
# model itself: python -m spacy download en_core_web_sm. Optional for the
# same reason as everything else here -- phi_scan (regex) still runs with
# nothing installed, and screen() reports ner_screening_active so a missing
# install is visible rather than silently read as "clean".
phi_ner = ["spacy>=3.7"]
# The mandated stack, kept optional so the core package, its tests and the
# evaluation harness all still run on a clean checkout with nothing installed.
# The hand-rolled loop is the dependency-free reference the graph is checked
# against, and losing that would mean no way to tell a refactor from a change.
graph = ["langgraph>=0.2"]
retrieval = ["sentence-transformers>=3", "qdrant-client>=1.9"]
stack = [
    "langgraph>=0.2",
    "sentence-transformers>=3",
    "qdrant-client>=1.9",
]
# scripts/webui/server.py -- a browser front end for the live consultation
# consult.py already does on a terminal. Reuses the same DiagnosticAgent loop
# unchanged (see the module docstring for how); this extra is just the web
# framework, not a second reasoning path.
webui = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
